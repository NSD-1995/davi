version: '3.9'
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: davi
      POSTGRES_USER: davi
      POSTGRES_PASSWORD: davi123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  clamav:
    profiles: ["student-migration"]
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable_base}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_signatures:/var/lib/clamav
    mem_limit: 4g

volumes:
  clamav_signatures:
  postgres_data:
